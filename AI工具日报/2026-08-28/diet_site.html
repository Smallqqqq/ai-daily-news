    <!-- Product Hunt badge. Pinned and OUT OF THE LAYOUT FLOW on purpose: the hero is a tuned single
         non-overflowing screen, and anything added in flow re-triggers the documented regression (overflow →
         classic scrollbar → its ~15px shoves the centred hero ~8px sideways on reload). Measured before
         adding this: only 44px of clearance under the CTA at 360x640, against a 54px badge. position:fixed
         costs zero vertical budget, so none of that arithmetic applies.
         Bottom-right by default (the convention). It falls back to the TOP-LEFT strip on short viewports:
         at bottom-right the badge covered the CTA by 7px at 360x640 and 31px at 320x640, where only ~20px
         remains below the CTA. Top-LEFT, not top-right, because the mobile replay button floats in the
         top-right red margin (y 134-216 at 390x844); the top-left strip is empty at every measured size —
         the can starts 117-167px down. -->
    <style>
      .ph-badge {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 10; /* site max is 3; the CRT overlay is -1 and pointer-events:none */
        line-height: 0; /* kill the inline-image descender gap */
      }
      .ph-badge img {
        display: block;
        width: 250px;
        height: 54px;
      }
      /* Narrow phones: 250px is 78% of a 320px screen. Scale from the corner so the offset holds. */
      @media (max-width: 420px) {
        .ph-badge {
          bottom: 12px;
          right: 12px;
          transform: scale(0.72);
          transform-origin: bottom right;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-s90CNkJG.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CAiUwGJ1.css">

  <body>
    <!-- STATIC, CRAWLABLE COPY — deliberately outside #root so React never replaces it.
         The page is client-rendered, so without this the served HTML is an empty <div> and every scraper
         that does not execute JS (most social/AI crawlers) sees a blank document. Visually hidden with
         INLINE styles rather than the .visually-hidden class, because that class lives in the bundled CSS
         and would not be applied before it loads (or at all, if JS/CSS fails). This is also the page's
         only <h1> — Hero.tsx no longer renders one. -->
    <h1
      style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0"
    >
      You weren't born to be rate-limited
    </h1>
    <p
      style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0"
    >
      Diet Claude is a usage meter for Claude: a soda can that drains as you use your session and refills
      when the limit resets. Free on the Chrome Web Store.
    </p>

    <!-- Static, outside #root, so it paints without waiting for the bundle, survives a JS failure, and
         lands in the served HTML for crawlers. This is the "Top Post" (daily) badge, which replaced the
         earlier featured.svg on 2026-08-27. theme=light is what Product Hunt supplies for it; the previous
         featured badge deliberately used theme=dark, because light renders #FF6154 on white and glares
         against the coral. If that glare is back, swap theme=light for theme=dark here.
         fetchpriority=low keeps it from competing with bg.webp, the LCP image.
         This is the site's ONLY third-party request. -->
    <a
      class="ph-badge"
      href="https://www.producthunt.com/products/diet-claude?embed=true&amp;utm_source=badge-top-post-badge&amp;utm_medium=badge&amp;utm_campaign=badge-diet-claude"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="https://api.producthunt.com/widgets/embed-image/v1/top-post-badge.svg?post_id=1229322&amp;theme=light&amp;period=daily&amp;t=1787815611583"
        alt="Diet Claude - Never get blindsided by Claude's usage limits again | Product Hunt"
        width="250"
        height="54"
        fetchpriority="low"
      />
    </a>
